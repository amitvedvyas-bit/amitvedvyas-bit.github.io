const FS=`#version 300 es

function togTour(){tour=!tour;tourT=0;$('bt').style.background=tour?'#a4522a':''}
let phoStill=0,phoN=0;function togPhoto(){photo=!photo;phoN=0;phoStill=0;$('bp').style.background=photo?'#a4522a':''}
$('bt').onclick=togTour;$('bp').onclick=togPhoto;$('bs').onclick=scream;
$('tier').onchange=e=>setTier(e.target.value);
function setTier(n){tierName=n;T=TIERS[n];$('tier').value=n;resize();regen()}
function resize(){const d=Math.min(T.dpr,devicePixelRatio||1);cv.width=Math.max(2,Math.floor(innerWidth*d));cv.height=Math.max(2,Math.floor(innerHeight*d));phoN=0}
addEventListener('resize',resize);
/* startup benchmark -> tier */
function bench(){const buf=gl.createBuffer(),N=100000,a=new Float32Array(N*12);for(let i=0;i<N;i++){const k=i*12;a[k]=(i%100)*.1;a[k+1]=(i/100%100)*.05;a[k+2]=-5-(i%7);a[k+3]=.05;a[k+4]=1;a[k+7]=.35;a[k+9]=1;a[k+11]=12}
const dummy={buf:a,n:N,c:[0,0,0],r:1e3,j:{t:'x'}};const c=mkChunk(dummy);const save=chunks;chunks=[c];const t0=performance.now();for(let i=0;i<6;i++)render(0,0);gl.finish();const ms=(performance.now()-t0)/6;chunks=save;gl.deleteBuffer(c.b);return ms}
function pickTier(){const r=(()=>{try{const e=gl.getExtension('WEBGL_debug_renderer_info');return e?gl.getParameter(e.UNMASKED_RENDERER_WEBGL):''}catch(_){return''}})();
if(/swiftshader|llvmpipe|software/i.test(r))return'Mobile';cv.width=640;cv.height=360;const ms=bench();let t=ms<3?'Ultra':ms<7?'High':ms<16?'Medium':'Mobile';if(touchDev&&(t==='Ultra'||t==='High'))t='Medium';if(touchDev&&innerWidth<600)t='Mobile';return t}
/* loop */
let last=performance.now(),acc=[],fpsS=60,hi=0,lastSig='',stillT=0;
function loop(ts){requestAnimationFrame(loop);if(frozen||!window.__ready&&!chunks.length)return;const dt=Math.min(.05,(ts-last)/1000);last=ts;
const doSim=!photo;if(doSim){updateWorld(dt);driveCam(dt)}
const sig=[C.yaw,C.pitch,C.dist,C.tx,C.ty,C.tz,cv.width].join();if(sig!==lastSig){lastSig=sig;stillT=0;phoN=0}else stillT+=dt;
if(photo){if(stillT>.5&&phoN<32){const i=phoN++;render(hal(i+1,2)-.5,hal(i+1,3)-.5);present(1/(i+1))}else if(phoN===0){render(0,0);present(1)}}
else{render(0,0);present(1)}
acc.push(dt);if(acc.length>=30){const a=acc.reduce((x,y)=>x+y)/acc.length;acc=[];fpsS=1/a;if(!photo){if(fpsS<40&&rscale>.61){rscale=Math.max(.6,rscale-.1);hi=0}else if(fpsS>57&&rscale<.99){if(++hi>=4){rscale=Math.min(1,rscale+.1);hi=0}}else hi=0}}
if(hud)$('hud').textContent=`FPS ${fpsS.toFixed(0)}  tier ${tierName}\nstrokes ${(visCount/1e3).toFixed(0)}k / ${(total/1e3).toFixed(0)}k  bristles ${T.nb}\nphysics ${phys==='Rapier'?'Rapier':'fallback'}  scale ${rscale.toFixed(1)}\n${photo?`photo ${phoN}/32`:tour?'tour':auto&&idle>4?'auto':'manual'}`}
/* test hooks */
const PRE={wide:()=>{C.yaw=.3;C.pitch=.1;C.dist=40;const b=bp(10,0,0);Object.assign(C,{tx:b[0],ty:2,tz:b[2]})},
close:()=>{const b=bp(15,.5,0);Object.assign(C,{tx:b[0],ty:.05,tz:b[2],yaw:.338,pitch:.35,dist:1.3})},
hero:()=>{const b=bp(30,0,0);P.x=b[0];P.z=b[2];P.y=0;P.face=.338+1.2+Math.PI-.4;Object.assign(C,{tx:b[0],ty:1.45,tz:b[2],yaw:.338+1.2,pitch:.05,dist:4.2})},
sky:()=>{const b=bp(20,0,0);Object.assign(C,{tx:b[0],ty:2,tz:b[2],yaw:.338,pitch:.55,dist:8})},
tour:()=>{tourT=20;tour=true;driveCam(0);tour=false},
mobile:()=>{const b=bp(25,0,0);P.x=b[0];P.z=b[2];P.y=0;P.face=.338;Object.assign(C,{tx:b[0],ty:1.5,tz:b[2],yaw:.338,pitch:.12,dist:9})}};
window.__shot=(id,ph)=>{frozen=true;time=10;shockT=1e3;updateWorld(0);PRE[id]();DYN[0].x=P.x;DYN[0].y=P.y;DYN[0].z=P.z;DYN[0].yaw=P.face;if(ph)photoRender(32);else{render(0,0);present(1)}return id};
window.__release=()=>{frozen=false};window.__info=()=>({tier:tierName,total,visCount,phys,rscale,w:cv.width,h:cv.height});
/* start */
(async()=>{resize();const t=new URLSearchParams(location.search).get('tier')||pickTier();setTier(t);loadRapier();requestAnimationFrame(loop)})();
</script></body></html>

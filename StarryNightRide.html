<script>

/* ---------- terrain function (mirrored in GLSL for grass) ---------- */
const A={x:75,z:-75},Bp={x:12,z:-6},CL={x:82,z:-84},PR=44;
function sdSeg(x,z){const dx=Bp.x-A.x,dz=Bp.z-A.z;let t=((x-A.x)*dx+(z-A.z)*dz)/(dx*dx+dz*dz);t=Math.min(1,Math.max(0,t));return Math.hypot(x-A.x-dx*t,z-A.z-dz*t)}

function palAt(x,z,y,ny,r){

 {const u=nrm([A.x-CL.x,0,A.z-CL.z]);for(let i=0;i<K(5000);i++){const t=rnd(),dd=8.3+t*3,y=14.5-t*16+(rnd()-.5)*.4,s=(rnd()-.5)*3.2,x=CL.x+u[0]*dd-u[2]*s,z=CL.z+u[2]*dd+u[0]*s;S(x,Math.max(y,WY),z,u[0],.25,u[2],0,-1,0,.7,rnd()<.2?30:7,0,2)}}
